<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Conta | GameLab</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style-conta.css">
</head>
<body>

<!-- BOTÃO HAMBURGER (fora do header para ser visível em mobile) -->
<button id="hamburger-menu" class="hamburger-menu" aria-label="Menu">
    <span></span>
    <span></span>
    <span></span>
</button>

<header>
    <div class="logo">🎮 GameLab</div>
    <nav class="nav-menu">
        <a href="../index.html" class="nav-link">Início</a>
        <a href="../cursos.html" class="nav-link">Cursos</a>
        <a href="../recursos.html" class="nav-link">Recursos</a>
        <a href="../contato.html" class="nav-link">Contato</a>
    </nav>
</header>

<a href="javascript:history.back();" class="btn-voltar">← Voltar</a>

<main class="auth-page">
    <section class="auth-card">
        <h1>Entrar na sua Conta</h1>
        <p>Insira seu e-mail e senha para acessar sua conta.</p>

        <form id="loginForm">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="seu@exemplo.com">

            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required placeholder="Senha">

            <button type="submit" class="btn-primario">Entrar</button>
        </form>

        <p class="auth-note">Ainda não tem conta? <a href="Cadastro.html">Crie sua conta</a></p>

        <div id="loginMessage" class="auth-message" aria-live="polite"></div>
    </section>
</main>

<footer>
    <p>&copy; 2024 GameLab</p>
</footer>

<script>
// Simples lógica de autenticação no lado do cliente usando localStorage
document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('loginMessage');

    const usersJson = localStorage.getItem('gamelab_users');
    const users = usersJson ? JSON.parse(usersJson) : [];

    const user = users.find(u => u.email === email);
    if (!user) {
        msg.textContent = 'Conta não encontrada. Verifique o e-mail ou cadastre-se.';
        msg.className = 'auth-message error';
        return;
    }
    if (user.password !== password) {
        msg.textContent = 'Senha incorreta.';
        msg.className = 'auth-message error';
        return;
    }

    // login bem sucedido
    localStorage.setItem('gamelab_currentUser', JSON.stringify({name: user.name, email: user.email}));
    msg.textContent = 'Login bem-sucedido! Redirecionando...';
    msg.className = 'auth-message success';
    setTimeout(()=> location.href = '../index.html', 1000);
});
</script>
<script src="../hamburger-menu.js"></script>

</body>
</html>
